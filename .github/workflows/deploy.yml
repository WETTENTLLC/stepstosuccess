name: Build, test and (manually) deploy

# Nothing publishes automatically. Deployment only runs from a manual "Run workflow" with deploy=true,
# and only after the launch gate passes and a reviewer approves the protected "github-pages" environment.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages (requires launch approval in config/site.json)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BROWSER_CHANNEL: chrome

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build staging (dev) site for the dev-server test suites
        run: npm run build
      - name: Test suites (dev server, not deployed)
        run: |
          npm run seo
          npm run security
          npm run a11y
          node server.js & 
          sleep 3
          npm run check
          kill %1
      - name: Production static build
        run: npm run build:prod
      - name: Test the production build exactly as GitHub Pages serves it
        run: npm run test:dist
      - name: Launch gate (informational on normal runs)
        run: npm run launch-gate | tee launch-gate.txt
        continue-on-error: true
      - name: Publish launch-gate result to the job summary
        run: |
          { echo '### Launch gate'; echo '```'; cat launch-gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify dist contains only approved static files
        run: |
          if find dist \( -name 'server.js' -o -name '.env*' -o -name 'package*.json' -o -path 'dist/config' -o -path 'dist/assets' -o -path 'dist/lib' -o -path 'dist/review' \) | grep -q .; then
            echo "Forbidden files in dist"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hard stop unless every launch blocker is cleared
        run: |
          npm run build:prod
          npm run launch-gate
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post-deployment smoke test on the live domain
        run: node review/smoke.js https://dnncstepstosuccess.com --expect-live
